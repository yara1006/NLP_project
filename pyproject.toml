[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adv-fraud-nlp"
version = "0.1.0"
description = "Adversarial attack and robustness evaluation for Chinese fraud text classification"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "datasets>=2.12",
    "dashscope>=1.10",
    "bert-score>=0.3.13",
    "jieba>=0.42",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "tqdm>=4.65",
    "accelerate>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
